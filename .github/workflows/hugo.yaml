name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "hugo-investment-reports/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify
        working-directory: hugo-investment-reports

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hugo-investment-reports/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
